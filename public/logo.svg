<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="mint-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2FCE5" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#008A5E" />
    </linearGradient>
    <filter id="subtle-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#subtle-bloom)" transform="translate(100, 150)">
    <!-- DNA double-helix structures forming the G & I monogram -->
    <!-- Left twist strand -->
    <path d="M 300,50 C 450,50 550,150 550,300 C 550,450 450,550 300,550 C 150,550 50,450 50,300 C 50,150 150,50 300,50 Z" stroke="url(#mint-glow-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" />
    
    <!-- Primary sweeping strands that twist and overlap -->
    <path d="M 280,100 C 380,100 480,180 510,280 C 520,310 490,330 460,310 C 430,290 370,220 280,220 C 190,220 150,280 150,350 C 150,420 190,480 280,530 C 370,580 480,630 480,750 C 480,870 380,950 280,950 C 180,950 80,870 50,770 C 40,740 70,720 100,740 C 130,760 190,830 280,830 C 370,830 410,770 410,700 C 410,630 370,570 280,520 C 190,470 80,420 80,300 C 80,180 180,100 280,100 Z" fill="url(#mint-glow-grad)" />
    
    <!-- Center G-link bridging element -->
    <path d="M 280,450 H 480 C 510,450 530,470 530,500 C 530,530 510,550 480,550 H 280 C 250,550 230,530 230,500 C 230,470 250,450 280,450 Z" fill="url(#mint-glow-grad)" />
    
    <!-- Intertwined secondary strand forming the core DNA twist -->
    <path d="M 180,250 C 240,190 360,190 420,250 C 440,270 420,300 395,290 C 360,275 300,275 265,290 C 240,300 220,270 180,250 Z" fill="url(#mint-glow-grad)" />
    <path d="M 180,650 C 240,590 360,590 420,650 C 440,670 420,700 395,690 C 360,675 300,675 265,690 C 240,700 220,670 180,650 Z" fill="url(#mint-glow-grad)" />
  </g>
</svg>
